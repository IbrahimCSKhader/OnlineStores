<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-label="Transparent Smartphone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="900" height="700" rx="34" fill="url(#bg)"/>
  <rect x="70" y="64" width="760" height="572" rx="28" fill="#ffffff" opacity="0.10"/>
  <g filter="url(#shadow)">
        <rect x="340" y="122" width="220" height="354" rx="38" fill="url(#device)" stroke="#e0f2fe" stroke-width="12"/>
    <rect x="378" y="172" width="144" height="246" rx="16" fill="#0f172a" opacity="0.82"/>
    <circle cx="414" cy="216" r="22" fill="#dbeafe"/>
    <circle cx="470" cy="216" r="22" fill="#93c5fd"/>
    <rect x="395" y="366" width="110" height="18" rx="9" fill="#bfdbfe"/>
  </g>
  <text x="450" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#ffffff">Transparent Smartphone</text>
  <text x="450" y="613" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#e5f2ff">Smartphone</text>
</svg>